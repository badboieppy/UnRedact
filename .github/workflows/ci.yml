name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy

      - name: Run clippy
        run: cargo clippy --release --all-features --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --release --all-features

      - name: Benchmark smoke - guess accuracy
        run: >
          cargo run --release --features cli-entry --bin guess_accuracy_benchmark --
          --out benchmark/ci_guess_accuracy.json
          --repeats 1

  wasm-warning-free:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust + wasm target
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Run wasm clippy
        run: >
          cargo clippy
          --target wasm32-unknown-unknown
          --no-default-features
          --features "shared-bytes-workflow,web-entry"
          -- -D warnings

      - name: Check wasm build with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: >
          cargo check
          --target wasm32-unknown-unknown
          --no-default-features
          --features "shared-bytes-workflow,web-entry"

      - name: Build wasm package
        working-directory: web_bindings
        run: >
          wasm-pack build
          --out-name unredact
          --target web
          --out-dir ../web/pkg
          --release

      - name: Run wasm Node smoke test
        run: npm run test:wasm-smoke

      - name: Install Playwright dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser wasm smoke test
        run: npm run test:web-ui-benchmark
