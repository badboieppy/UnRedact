[package]
name = "unredact"
version = "0.1.0"
edition = "2021"
description = "Utilities for font detection and redaction discovery in documents."
repository = "https://example.com/your-org/unredact"
keywords = ["pdf", "redaction", "forensics", "fonts", "cli"]
categories = ["command-line-utilities", "text-processing"]
license-file = "LICENSE"

[dependencies]
clap = { version = "4.5.27", features = ["derive"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
lopdf = "0.34.0"
hayro = "0.5.0"
rustybuzz = "0.13.0"
ttf-parser = "0.20.0"
image = "0.25.5"
sha2 = "0.10.8"

[dev-dependencies]
pretty_assertions = "1.4.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
strip = "symbols"

[profile.bench]
inherits = "release"
