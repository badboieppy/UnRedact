[package]
name = "unredact"
version = "0.1.0"
edition = "2021"
description = "Utilities for font detection and redaction discovery in documents."
repository = "https://example.com/your-org/unredact"
keywords = ["pdf", "redaction", "forensics", "fonts", "cli"]
categories = ["command-line-utilities", "text-processing"]
license-file = "LICENSE"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = [
    "shared-bytes-workflow",
    "local-file-workflow",
    "cli-entry",
    "web-entry",
]
shared-bytes-workflow = []
local-file-workflow = []
cli-entry = ["dep:clap", "shared-bytes-workflow", "local-file-workflow"]
web-entry = ["shared-bytes-workflow", "dep:wasm-bindgen", "dep:serde-wasm-bindgen"]

[dependencies]
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
lopdf = "0.34.0"
hayro = "0.5.0"
rustybuzz = "0.13.0"
ttf-parser = "0.20.0"
image = "0.25.5"
sha2 = "0.10.8"
clap = { version = "4.5.27", features = ["derive"], optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = { version = "0.2.108", optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
js-sys = "0.3.85"

[dev-dependencies]
pretty_assertions = "1.4.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
strip = "symbols"

[profile.bench]
inherits = "release"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--all-features"]

[[bin]]
name = "unredact-cli"
path = "src/main.rs"
required-features = ["cli-entry"]

[[bin]]
name = "guess_accuracy_benchmark"
path = "src/bin/guess_accuracy_benchmark.rs"
required-features = ["cli-entry"]

[[bin]]
name = "pdf_to_png"
path = "src/bin/pdf_to_png.rs"
required-features = ["cli-entry"]

[[bin]]
name = "visual_score_impact_benchmark"
path = "src/bin/visual_score_impact_benchmark.rs"
required-features = ["cli-entry"]
